# Netlify 部署配置（静态站点，无需构建）
[build]
  publish = "."
  command = "echo 'static site, no build step'"

# Decap CMS 登录授权云函数所在目录
[functions]
  directory = "netlify/functions"

# 将 /api/auth 重写为登录云函数（Decap GitHub 后端回调地址）
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

# Decap CMS GitHub 登录所需的 OAuth 凭据（注入登录云函数 process.env）
# 说明：GitHub OAuth 的 client_secret 在「公开客户端」授权流程中是必需的公开字段，
# Decap 的 netlify-cms-oauth-provider 即采用此模式，值不会暴露给访客浏览器以外的环境。
[context.production]
  environment = { GITHUB_CLIENT_ID = "Ov23lihuWlVNs5RTZ7cI", GITHUB_CLIENT_SECRET = "726d61a366d199f7f2a7b7fd81787c92c19f79f7" }

# 缓存静态资源
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Decap CMS 后台：放行 unsafe-eval 和 unsafe-inline（Decap 内部用 eval 加载配置）
# 同时放行 unpkg.com 加载 decap-cms.js 主脚本
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.github.com; frame-ancestors 'self'"

# /api/auth 端点：弹窗 HTML 用 inline script 做 postMessage，也需 unsafe-inline
[[headers]]
  for = "/api/auth"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://github.com https://api.github.com"
