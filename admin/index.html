<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>尹辰官网 · 内容管理后台</title>
  <style>
    body { margin:0; background:#0a1422; font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
  </style>

  <!--
    OAuth Recovery Script (must run BEFORE Decap loads)
    场景：用户点了 Login with GitHub，浏览器（不是弹窗）直接被 GitHub 重定向到了 /admin/#access_token=...。
    这种情况下 Decap 收不到 postMessage（弹窗协议），但我们手里已经有 token。
    这个脚本会：
      1. 把 URL hash 里的 access_token 同步到 localStorage 并清掉 URL
      2. 监听用户后续点 Login 时触发的 'authorizing:github' 握手，注入 'authorization:github:success:{json}' 给 Decap
      3. 同时拦截 window.open 处理 popup 被屏蔽的兜底
  -->
  <script>
  (function() {
    var RECOVERY_KEY = 'decap_oauth_recovery';

    // ===== Step 1: 把 URL hash 里的 token 存到 localStorage =====
    var hash = window.location.hash;
    if (hash && hash.indexOf('access_token') !== -1) {
      var hashStr = hash.charAt(0) === '#' ? hash.substring(1) : hash;
      var params = new URLSearchParams(hashStr);
      var token = params.get('access_token');
      if (token) {
        try {
          localStorage.setItem(RECOVERY_KEY, JSON.stringify({
            token: token,
            provider: 'github',
            scope: params.get('scope') || 'repo'
          }));
          window.history.replaceState(null, '', window.location.pathname);
          console.log('[Decap OAuth Recovery] Token 从 URL 临时保存。点击「Login with GitHub」完成登录。');
        } catch (e) {}
      }
    }

    var hasRecovery = function() {
      try { return localStorage.getItem(RECOVERY_KEY) !== null; } catch (e) { return false; }
    };

    var fireRecovery = function() {
      if (!hasRecovery()) return;
      try {
        var pd = JSON.parse(localStorage.getItem(RECOVERY_KEY));
        var payload = JSON.stringify({ token: pd.token, provider: pd.provider, scope: pd.scope });
        // 派发 Decap 期望的 success 消息（string 格式，netlify-auth.js 用 e.data.indexOf('authorization:...') 匹配）
        window.dispatchEvent(new MessageEvent('message', {
          data: 'authorization:github:success:' + payload
        }));
        // 也额外尝试一次 object 格式（如果某版本 Decap 用 e.data.type 判断）
        window.dispatchEvent(new MessageEvent('message', {
          data: { type: 'authorization:github:success', token: pd.token, provider: pd.provider, scope: pd.scope }
        }));
        localStorage.removeItem(RECOVERY_KEY);
        console.log('[Decap OAuth Recovery] 已注入 token，应当自动进入后台。');
      } catch (e) {
        console.error('[Decap OAuth Recovery] 失败：', e);
      }
    };

    // ===== 额外兜底：监听 localStorage 的 storage 事件 =====
    // 弹窗（popup）在拿到 token 后会把 token 写入 localStorage。即使浏览器把弹窗的
    // window.opener 置空（postMessage 传不回主窗口），父窗口也能通过 storage 事件收到通知，
    // 再派发 success 消息给 Decap 完成登录。
    window.addEventListener('storage', function(e) {
      if (e.key === 'decap_oauth_token' && e.newValue) {
        try {
          var pd = JSON.parse(e.newValue);
          var payload = JSON.stringify({ token: pd.token, provider: pd.provider, scope: pd.scope });
          window.dispatchEvent(new MessageEvent('message', {
            data: 'authorization:github:success:' + payload
          }));
          localStorage.removeItem('decap_oauth_token');
          console.log('[Decap OAuth Recovery] storage 事件触发，已注入 token。');
        } catch (err) {
          console.error('[Decap OAuth Recovery] storage 解析失败', err);
        }
      }
    });

    // ===== Step 2: 拦截 window.open 处理 popup 行为 =====
    var origOpen = window.open ? window.open.bind(window) : null;
    if (origOpen) {
      window.open = function() {
        var popup = origOpen.apply(window, arguments);
        if (!popup) {
          // Popup blocked
          if (hasRecovery()) {
            console.warn('[Decap OAuth Recovery] Popup 被屏蔽，用 fallback 注入 token。');
            setTimeout(function() {
              window.dispatchEvent(new MessageEvent('message', { data: 'authorizing:github' }));
              setTimeout(fireRecovery, 200);
            }, 50);
          }
        } else {
          // Popup opened: 如果我们手里有 token 就直接关掉 popup，用 token 完成登录
          window.__nc_oauth_popup = popup;
          if (hasRecovery()) {
            setTimeout(function() { try { popup.close(); } catch (e) {} }, 100);
            setTimeout(function() {
              window.dispatchEvent(new MessageEvent('message', { data: 'authorizing:github' }));
              setTimeout(fireRecovery, 200);
            }, 50);
          }
        }
        return popup;
      };
    }

    // ===== Step 3: 拦截 message 监听（捕获 Decap 的 handshake） =====
    var origAdd = window.addEventListener.bind(window);
    window.addEventListener = function(type) {
      if (type === 'message') {
        var args = Array.prototype.slice.call(arguments, 1);
        var origHandler = args[0];
        args[0] = function(e) {
          try { origHandler.call(this, e); } catch (err) {}
          // Decap 收到 'authorizing:github' 之后会立刻把监听换成等 success。
          // 我们也监听 'authorizing:github'，判断要不要注入 recovery token
          if (e && e.data === 'authorizing:github' && hasRecovery()) {
            setTimeout(fireRecovery, 200);
          }
        };
        return origAdd.apply(window, [type].concat(args));
      }
      return origAdd.apply(window, arguments);
    };
  })();
  </script>
</head>
<body>
  <!-- Decap CMS 会自动读取同目录下的 config.yml -->
  <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>
</body>
</html>
