<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>尹辰官网 · 内容管理后台</title>
  <!-- 内嵌空 favicon，避免浏览器请求 /favicon.ico 产生 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231a2845'/%3E%3Ctext x='8' y='13' font-size='12' text-anchor='middle' fill='%23f7c948' font-family='sans-serif'%3E尹%3C/text%3E%3C/svg%3E" />
  <style>
    body { margin:0; background:#0a1422; font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
  </style>

  <!--
    OAuth Recovery Script
    ============================================================
    解决问题：弹窗里的 postMessage 在某些浏览器/扩展场景下传不回主窗口。
    兜底机制（按优先级）：
      1. 监听 storage 事件：弹窗（与主窗口同源）把 token 写 localStorage 时，
         主窗口通过 storage 事件拿到，注入 success 消息。
      2. 监听 message 事件：捕获弹窗（顺利的话）的授权:github:success 消息。
         这个是 Decap 默认机制，我们额外兜个底捕获一次，确保被处理。
      3. URL hash 兜底：如果某次 OAuth App callback 配错，GitHub 直接把
         token 送回主窗口 /admin/#access_token=...，我们存到 localStorage
         并清掉 URL，下次点 Login 时通过 storage 事件转发。

    注意事项：坚决不拦截 window.open，绝不主动 close 弹窗。
    任何"自动关弹窗"的逻辑都会破坏正常 OAuth 流程。
    ============================================================
  -->
  <script>
  (function() {
    'use strict';

    // ===== 路径 1: URL hash 兜底（GitHub 直接跳主窗口场景）=====
    var RECOVERY_KEY = 'decap_oauth_recovery';
    var hash = window.location.hash;
    if (hash && hash.indexOf('access_token') !== -1) {
      var hashStr = hash.charAt(0) === '#' ? hash.substring(1) : hash;
      var params = new URLSearchParams(hashStr);
      var token = params.get('access_token');
      if (token) {
        try {
          localStorage.setItem(RECOVERY_KEY, JSON.stringify({
            token: token,
            provider: 'github',
            scope: params.get('scope') || 'repo'
          }));
          window.history.replaceState(null, '', window.location.pathname);
          console.log('[Decap OAuth Recovery] 检测到 URL hash 携带 token，已保存到 localStorage。');
        } catch (e) {}
      }
    }

    var hasRecovery = function() {
      try { return localStorage.getItem(RECOVERY_KEY) !== null; } catch (e) { return false; }
    };

    var fireRecovery = function() {
      if (!hasRecovery()) return;
      try {
        var pd = JSON.parse(localStorage.getItem(RECOVERY_KEY));
        var payload = JSON.stringify({ token: pd.token, provider: pd.provider, scope: pd.scope });
        // 关键修复：用 window.postMessage 给当前 origin。
        // 浏览器自动把 e.origin 设为该 origin，使 Decap 内部 NetlifyAuthenticator.authorizeCallback
        // 的 `r.origin === this.base_url`（'https://yinchen.netlify.app'）检查通过。
        // 之前用 dispatchEvent(new MessageEvent(...)) 时 origin=""，永远被 Decap reject。
        window.postMessage('authorization:github:success:' + payload, window.location.origin);
        // 兼容：再发对象格式
        window.postMessage({ type: 'authorization:github:success', token: pd.token, provider: pd.provider, scope: pd.scope }, window.location.origin);
        localStorage.removeItem(RECOVERY_KEY);
        console.log('[Decap OAuth Recovery] postMessage 注入 token，应当自动进入后台。');
      } catch (e) {
        console.error('[Decap OAuth Recovery] 失败：', e);
      }
    };

    // ===== 路径 2: storage 事件兜底（弹窗写 localStorage 后主窗口接管）=====
    // 弹窗（与主窗口同源 yinchen.netlify.app）写入 decap_oauth_token 时，
    // 主窗口的 storage 事件会触发，我们把 token 提到 RECOVERY_KEY，再 fireRecovery。
    window.addEventListener('storage', function(e) {
      if (e.key === 'decap_oauth_token' && e.newValue) {
        try {
          // 弹窗同时也会清理这个 key；保险起见，我们把 token 也存到 RECOVERY_KEY
          var pd = JSON.parse(e.newValue);
          localStorage.setItem(RECOVERY_KEY, JSON.stringify(pd));
          console.log('[Decap OAuth Recovery] storage 事件触发，已提取 token，等待 Decap 握手以注入。');
          // 派发一次握手给 Decap 触发其等待 success 的状态机
          window.dispatchEvent(new MessageEvent('message', { data: 'authorizing:github' }));
          // 在 Decap 进入等待状态后注入 success
          setTimeout(fireRecovery, 200);
        } catch (err) {
          console.error('[Decap OAuth Recovery] storage 解析失败', err);
        }
      }
    });

    // ===== 路径 3: 拦截 message 监听器，捕获握手 =====
    // 当 Decap 在父窗口收到弹窗发来的 'authorizing:github' 握手时，
    // 我们也趁机把 RECOVERY_KEY 里的 token 喂给 Decap 完成登录。
    // 用于 URL hash 路径：用户被 GitHub 直接重定向到 /admin/，URL 上的 token
    // 已经在页面加载时被存到 RECOVERY_KEY；用户点 Login 后，弹窗会发握手，
    // 我们趁机注入 token。
    var origAdd = EventTarget.prototype.addEventListener;
    EventTarget.prototype.addEventListener = function(type) {
      if (type === 'message' && this === window) {
        var args = Array.prototype.slice.call(arguments);
        var origHandler = args[0];
        args[0] = function(e) {
          try { origHandler.call(this, e); } catch (err) {}
          if (e && e.data === 'authorizing:github' && hasRecovery()) {
            console.log('[Decap OAuth Recovery] 捕获到握手，注入 token。');
            setTimeout(fireRecovery, 200);
          }
        };
        return origAdd.apply(this, [type].concat(args));
      }
      return origAdd.apply(this, arguments);
    };
  })();
  </script>
</head>
<body>
  <!-- Decap CMS 会自动读取同目录下的 config.yml。
       锁版本到 3.6.4，避免 @3 浮动版本引入新 CSP/eval 兼容问题。 -->
  <script src="https://unpkg.com/decap-cms@3.6.4/dist/decap-cms.js"></script>
</body>
</html>
