<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尹辰 · AI 效率教练｜企业数字化转型顾问</title>
<meta name="description" content="尹辰——20+ 年企业管理实战，800+ 场企业内训。AI 应用首席顾问、AIGC 技能导师，提供从 AI 培训到系统落地的全案交付。">
<!-- 字体：思源宋体(标题) + 思源黑体(正文)；若加载慢会自动回退系统字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ============ 顶栏 Header ============ -->
<header class="header">
  <div class="wrap">
    <a class="brand" href="#home">
      <span class="brand-mark">尹</span>
      <span>
        <span class="brand-name">尹辰</span><br>
        <span class="brand-sub">YINCHEN</span>
      </span>
    </a>
    <a class="btn cta-head" data-open-modal>预约合作</a>
    <button class="menu-btn" aria-label="菜单">☰</button>
  </div>
</header>

<!-- ============ Hero 首屏（固定，内容来自 content.json 的 hero 字段） ============ -->
<section class="hero" id="home">
  <div class="wrap hero-grid">
    <div class="hero-left">
      <span class="hero-kicker" id="heroKicker"></span>
      <h1 id="heroTitle"></h1>
      <p class="hero-sub" id="heroSub"></p>
      <div class="cta-row">
        <a class="btn" data-open-modal>预约企业内训</a>
        <a class="btn btn-ghost" href="#courses">查看完整课程体系</a>
      </div>
      <div class="stats" id="statsGrid"></div>
    </div>
    <div class="portrait-wrap">
      <img class="portrait" id="heroImg" src="" alt="尹辰形象照">
    </div>
  </div>
</section>

<!-- ============ 页面主体：模块区（由 main.js 按 content.json 的 modules 数组动态渲染） ============ -->
<main id="modulesRoot"></main>

<!-- ============ Footer / 联系（固定） ============ -->
<footer class="footer" id="contact">
  <div class="wrap">
    <div class="foot-body">
      <div>
        <div class="foot-brand" id="footBrand"></div>
        <div class="role" id="footRole"></div>
      </div>
      <div class="foot-col">
        <h4>联系方式</h4>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
          <img id="wechatImg" src="" alt="微信二维码" style="width:100px;height:100px;border-radius:10px;border:1px solid rgba(232,194,104,.3);">
        </div>
        <a id="footEmail" href=""></a>
      </div>
      <div class="foot-col">
        <h4>快速导航</h4>
        <div id="footNav"></div>
        <a href="admin/" style="color:var(--gold);font-size:13px;margin-top:10px;display:inline-block;">⚙ 管理后台</a>
      </div>
    </div>
    <div class="foot-bottom">2026 尹辰 · 保留所有权利</div>
  </div>
</footer>

<!-- ============ 留资弹窗 Modal ============ -->
<div class="modal-overlay" id="leadModal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="关闭">&times;</button>
    <div class="modal-head">
      <h3>预约咨询</h3>
      <p>留下您的联系方式，尹辰将在 24 小时内与您联系</p>
    </div>
    <form class="lead-form" id="leadForm" action="https://formsubmit.co/joyeat@163.com" method="POST">
      <!-- FormSubmit.co：免注册，直接将表单数据发送到指定邮箱 -->
      <input type="hidden" name="_subject" value="📋 尹辰官网留资 - 新咨询需求">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <div class="field">
        <label for="lf-name">姓名 <span class="req">*</span></label>
        <input type="text" id="lf-name" name="name" placeholder="您的姓名" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="lf-company">公司/机构</label>
          <input type="text" id="lf-company" name="company" placeholder="选填">
        </div>
        <div class="field">
          <label for="lf-phone">手机/微信 <span class="req">*</span></label>
          <input type="tel" id="lf-phone" name="phone" placeholder="联系方式" required>
        </div>
      </div>
      <div class="field">
        <label for="lf-type">咨询类型</label>
        <select id="lf-type" name="type">
          <option value="企业内训">企业内训 / 团队培训</option>
          <option value="个人课程">个人提效课程</option>
          <option value="数字化系统">数字化系统交付</option>
          <option value="公开课/分享">公开课 / 线上分享</option>
          <option value="其他">其他合作</option>
        </select>
      </div>
      <div class="field">
        <label for="lf-msg">补充说明</label>
        <textarea id="lf-msg" name="message" rows="3" placeholder="简要描述您的需求（选填）"></textarea>
      </div>

      <button type="submit" class="btn btn-submit" id="submitBtn">提交预约</button>
      <p class="form-note">✉️ 信息将安全发送至 joyeat@163.com，我们承诺保密</p>
    </form>
    <!-- 提交成功提示 -->
    <div class="modal-success" id="modalSuccess" style="display:none;">
      <div class="success-icon">✓</div>
      <h3>提交成功！</h3>
      <p>感谢您的信任，尹辰将尽快与您联系。</p>
      <button class="btn" id="successOk">好的</button>
    </div>
  </div>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
