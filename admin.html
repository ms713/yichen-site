<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尹辰官网 · 管理后台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:#0a1422; color:#e8edf3; line-height:1.6; }
  .gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#0c1a2b,#0a121f); z-index:100; }
  .gate-box { background:#11203a; border:1px solid rgba(232,194,104,.25); border-radius:16px;
    padding:40px 36px; width:340px; text-align:center; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .gate-box h1 { font-family:"Noto Serif SC",serif; font-size:24px; color:#f2d98a; margin-bottom:6px; }
  .gate-box p { color:#a9b7c6; font-size:14px; margin-bottom:18px; }
  .gate-box input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05); color:#fff; font-size:15px; margin-bottom:14px; outline:none; }
  .gate-box input:focus { border-color:#e8c268; }
  .gate-box button { width:100%; padding:12px; border:none; border-radius:10px; background:#e8c268;
    color:#081320; font-weight:700; font-size:15px; cursor:pointer; }
  .gate-hint { font-size:12px; color:#5a6b7d; margin-top:14px; margin-bottom:0; }

  .adm-top { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:14px 24px; background:rgba(10,20,34,.95); backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(232,194,104,.2); flex-wrap:wrap; }
  .adm-top strong { font-family:"Noto Serif SC",serif; color:#f2d98a; font-size:17px; }
  .adm-actions { display:flex; gap:10px; flex-wrap:wrap; }
  .adm-actions button { padding:9px 16px; border-radius:9px; border:1px solid rgba(232,194,104,.4);
    background:transparent; color:#f2d98a; font-size:14px; cursor:pointer; transition:.2s; }
  .adm-actions button:hover { background:rgba(232,194,104,.12); }
  .adm-actions button.primary { background:#e8c268; color:#081320; border-color:#e8c268; font-weight:700; }

  .adm-main { max-width:920px; margin:24px auto 80px; padding:0 20px; }
  .adm-sec { background:#11203a; border:1px solid rgba(255,255,255,.06); border-radius:14px;
    margin-bottom:18px; overflow:hidden; }
  .adm-sec > summary { cursor:pointer; padding:16px 20px; font-weight:700; font-size:16px; color:#f2d98a;
    list-style:none; user-select:none; }
  .adm-sec > summary::-webkit-details-marker { display:none; }
  .adm-sec > summary::before { content:"▾ "; color:#e8c268; }
  .adm-sec:not([open]) > summary::before { content:"▸ "; }
  .adm-sec-body { padding:8px 20px 22px; border-top:1px solid rgba(255,255,255,.06); }

  .adm-field { display:block; margin-bottom:14px; }
  .adm-field > span:first-child { display:block; font-size:13px; color:#a9b7c6; margin-bottom:6px; }
  .adm-field input[type=text], .adm-field textarea {
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05); color:#fff; font-size:14px; font-family:inherit; outline:none; }
  .adm-field input:focus, .adm-field textarea:focus { border-color:#e8c268; }
  .adm-field textarea { resize:vertical; min-height:62px; }
  .adm-field input[type=checkbox] { width:16px; height:16px; vertical-align:middle; margin-left:6px; }
  .adm-imgprev { display:block; max-width:280px; max-height:360px; width:auto; height:auto;
    object-fit:contain; border-radius:8px; border:1px solid rgba(255,255,255,.1);
    margin:6px 0; background:#0a1422; cursor:zoom-in; transition:transform .2s; }
  .adm-imgprev:hover { transform:scale(1.03); }

  .adm-item { background:#0d1a30; border:1px solid rgba(255,255,255,.08); border-radius:10px;
    padding:14px 14px 8px; margin-bottom:12px; cursor:grab; }
  .adm-item:active { cursor:grabbing; }
  .adm-item.dragging { opacity:.5; }
  .adm-item-ctrl { display:flex; gap:8px; margin:6px 0 4px; }
  .adm-item-ctrl button { padding:5px 12px; border-radius:7px; border:1px solid rgba(255,255,255,.12);
    background:transparent; color:#cfd8e2; font-size:13px; cursor:pointer; }
  .adm-item-ctrl button:hover { border-color:#e8c268; color:#e8c268; }
  .adm-add { padding:9px 16px; border-radius:9px; border:1px dashed rgba(232,194,104,.5);
    background:transparent; color:#f2d98a; font-size:14px; cursor:pointer; margin-bottom:6px; }
  .adm-add:hover { background:rgba(232,194,104,.1); }
  .adm-tip { font-size:12px; color:#5a6b7d; margin:4px 0 14px; }
</style>
</head>
<body>

<!-- 密码门 -->
<div id="gate" class="gate">
  <div class="gate-box">
    <h1>管理后台</h1>
    <p>请输入编辑密码进入</p>
    <input type="password" id="pwInput" placeholder="编辑密码" autofocus>
    <button id="pwBtn">进入编辑</button>
  </div>
</div>

<!-- 编辑器 -->
<div id="app" class="app" style="display:none;">
  <header class="adm-top">
    <strong>尹辰官网 · 可视化管理后台</strong>
    <div class="adm-actions">
      <button id="btnPreview">预览效果</button>
      <button id="btnClear">清空预览</button>
      <button id="btnExport" class="primary">导出 content.json</button>
    </div>
  </header>
  <main class="adm-main" id="admMain"></main>
</div>

<script>
(function () {
  'use strict';
  var ADMIN_PW = 'yc2026';      // ← 想改密码改这里
  var PREVIEW_KEY = 'yc_preview';
  var content = null;

  function E(id) { return document.getElementById(id); }
  function mkBtn(text, fn) { var b = document.createElement('button'); b.type = 'button'; b.textContent = text; b.addEventListener('click', fn); return b; }

  /* ---------- 文本/多行 字段 ---------- */
  function field(parent, label, getVal, setVal, multiline) {
    var lab = document.createElement('label'); lab.className = 'adm-field';
    lab.appendChild(document.createTextNode(label));
    var input = multiline ? document.createElement('textarea') : document.createElement('input');
    if (!multiline) input.type = 'text';
    input.value = getVal() || '';
    input.addEventListener('input', function () { setVal(input.value); });
    lab.appendChild(input);
    parent.appendChild(lab);
  }

  /* ---------- 下拉选择字段 ---------- */
  function selectField(parent, label, getVal, setVal, options) {
    var lab = document.createElement('label'); lab.className = 'adm-field';
    lab.appendChild(document.createTextNode(label));
    var sel = document.createElement('select');
    options.forEach(function (o) {
      var opt = document.createElement('option');
      opt.value = o.value; opt.textContent = o.label;
      if (o.value === (getVal() || '')) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function () { setVal(sel.value); });
    lab.appendChild(sel);
    parent.appendChild(lab);
  }

  /* ---------- 单张图片上传 ---------- */
  function imageField(parent, label, getVal, setVal) {
    var lab = document.createElement('label'); lab.className = 'adm-field';
    lab.appendChild(document.createTextNode(label));
    var prev = document.createElement('img'); prev.className = 'adm-imgprev'; prev.src = getVal() || '';
    lab.appendChild(prev);
    var input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
    input.addEventListener('change', function (e) {
      var file = e.target.files[0]; if (!file) return;
      var r = new FileReader();
      r.onload = function () { setVal(r.result); prev.src = r.result; };
      r.readAsDataURL(file);
    });
    lab.appendChild(input);
    parent.appendChild(lab);
  }

  /* ---------- 对象列表（拖拽排序） ---------- */
  function listEditor(parent, getArr, getFields, addLabel) {
    var dragSrc = null;
    function render() {
      parent.innerHTML = '';
      var arr = getArr();
      arr.forEach(function (item, idx) {
        var row = document.createElement('div'); row.className = 'adm-item'; row.draggable = true;
        getFields().forEach(function (f) {
          var lab = document.createElement('label'); lab.className = 'adm-field';
          lab.appendChild(document.createTextNode(f.label));
          var input;
          if (f.type === 'textarea') { input = document.createElement('textarea'); input.value = item[f.key] || ''; }
          else if (f.type === 'checkbox') { input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!item[f.key]; }
          else if (f.type === 'image') { input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; }
          else { input = document.createElement('input'); input.type = 'text'; input.value = item[f.key] || ''; }
          input.addEventListener('input', function () { if (f.type === 'checkbox') item[f.key] = input.checked; else item[f.key] = input.value; });
          if (f.type === 'image') {
            input.addEventListener('change', function (e) {
              var file = e.target.files[0]; if (!file) return;
              var r = new FileReader(); r.onload = function () { item[f.key] = r.result; prev.src = item[f.key]; };
              r.readAsDataURL(file);
            });
            var prev = document.createElement('img'); prev.className = 'adm-imgprev'; prev.src = item[f.key] || '';
            lab.appendChild(prev);
          }
          lab.appendChild(input);
          row.appendChild(lab);
        });
        var ctrl = document.createElement('div'); ctrl.className = 'adm-item-ctrl';
        ctrl.appendChild(mkBtn('↑', function () { move(idx, -1); }));
        ctrl.appendChild(mkBtn('↓', function () { move(idx, 1); }));
        ctrl.appendChild(mkBtn('删除', function () { var a = getArr(); a.splice(idx, 1); render(); }));
        row.appendChild(ctrl);
        row.addEventListener('dragstart', function (e) { dragSrc = idx; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
        row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
        row.addEventListener('dragover', function (e) { e.preventDefault(); });
        row.addEventListener('drop', function (e) {
          e.preventDefault(); var to = idx;
          if (dragSrc === null || dragSrc === to) return;
          var a = getArr(); var x = a.splice(dragSrc, 1)[0]; a.splice(to, 0, x); dragSrc = null; render();
        });
        parent.appendChild(row);
      });
      var add = mkBtn('＋ ' + addLabel, function () {
        var blank = {}; getFields().forEach(function (f) { blank[f.key] = f.type === 'checkbox' ? false : ''; });
        getArr().push(blank); render();
      });
      add.className = 'adm-add'; parent.appendChild(add);
    }
    function move(idx, dir) {
      var a = getArr(); var j = idx + dir;
      if (j < 0 || j >= a.length) return;
      var x = a.splice(idx, 1)[0]; a.splice(j, 0, x); render();
    }
    render();
  }

  /* ---------- 字符串列表（主题/认证/标签等） ---------- */
  function stringListEditor(parent, getArr, label, addLabel) {
    var dragSrc = null;
    function render() {
      parent.innerHTML = '';
      var arr = getArr();
      arr.forEach(function (val, idx) {
        var row = document.createElement('div'); row.className = 'adm-item'; row.draggable = true;
        var lab = document.createElement('label'); lab.className = 'adm-field';
        lab.appendChild(document.createTextNode(label + ' ' + (idx + 1)));
        var input = document.createElement('input'); input.type = 'text'; input.value = val || '';
        input.addEventListener('input', function () { arr[idx] = input.value; });
        lab.appendChild(input); row.appendChild(lab);
        var ctrl = document.createElement('div'); ctrl.className = 'adm-item-ctrl';
        ctrl.appendChild(mkBtn('↑', function () { move(idx, -1); }));
        ctrl.appendChild(mkBtn('↓', function () { move(idx, 1); }));
        ctrl.appendChild(mkBtn('删除', function () { arr.splice(idx, 1); render(); }));
        row.appendChild(ctrl);
        row.addEventListener('dragstart', function () { dragSrc = idx; row.classList.add('dragging'); });
        row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
        row.addEventListener('dragover', function (e) { e.preventDefault(); });
        row.addEventListener('drop', function (e) {
          e.preventDefault(); var to = idx;
          if (dragSrc === null || dragSrc === to) return;
          var x = arr.splice(dragSrc, 1)[0]; arr.splice(to, 0, x); dragSrc = null; render();
        });
        parent.appendChild(row);
      });
      var add = mkBtn('＋ ' + addLabel, function () { arr.push(''); render(); });
      add.className = 'adm-add'; parent.appendChild(add);
    }
    function move(idx, dir) {
      var j = idx + dir; if (j < 0 || j >= arr.length) return;
      var x = arr.splice(idx, 1)[0]; arr.splice(j, 0, x); render();
    }
    render();
  }

  /* ---------- 海报图片列表 ---------- */
  function imageListEditor(parent, getArr) {
    var dragSrc = null;
    function render() {
      parent.innerHTML = '';
      var arr = getArr();
      arr.forEach(function (src, idx) {
        var row = document.createElement('div'); row.className = 'adm-item'; row.draggable = true;
        var lab = document.createElement('label'); lab.className = 'adm-field';
        lab.appendChild(document.createTextNode('海报 ' + (idx + 1)));
        var prev = document.createElement('img'); prev.className = 'adm-imgprev'; prev.src = src || '';
        lab.appendChild(prev);
        var input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
        input.addEventListener('change', function (e) {
          var file = e.target.files[0]; if (!file) return;
          var r = new FileReader(); r.onload = function () { arr[idx] = r.result; prev.src = arr[idx]; };
          r.readAsDataURL(file);
        });
        lab.appendChild(input); row.appendChild(lab);
        var ctrl = document.createElement('div'); ctrl.className = 'adm-item-ctrl';
        ctrl.appendChild(mkBtn('↑', function () { move(idx, -1); }));
        ctrl.appendChild(mkBtn('↓', function () { move(idx, 1); }));
        ctrl.appendChild(mkBtn('删除', function () { arr.splice(idx, 1); render(); }));
        row.appendChild(ctrl);
        row.addEventListener('dragstart', function () { dragSrc = idx; row.classList.add('dragging'); });
        row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
        row.addEventListener('dragover', function (e) { e.preventDefault(); });
        row.addEventListener('drop', function (e) {
          e.preventDefault(); var to = idx;
          if (dragSrc === null || dragSrc === to) return;
          var x = arr.splice(dragSrc, 1)[0]; arr.splice(to, 0, x); dragSrc = null; render();
        });
        parent.appendChild(row);
      });
      var add = mkBtn('＋ 添加海报', function () { arr.push(''); render(); });
      add.className = 'adm-add'; parent.appendChild(add);
    }
    function move(idx, dir) {
      var j = idx + dir; if (j < 0 || j >= arr.length) return;
      var x = arr.splice(idx, 1)[0]; arr.splice(j, 0, x); render();
    }
    render();
  }

  /* ---------- 区块容器 ---------- */
  function section(title, fn) {
    var d = document.createElement('details'); d.className = 'adm-sec'; d.open = true;
    var s = document.createElement('summary'); s.textContent = title; d.appendChild(s);
    var c = document.createElement('div'); c.className = 'adm-sec-body'; d.appendChild(c);
    E('admMain').appendChild(d);
    fn(c);
  }

  /* ---------- 构建编辑器 ---------- */
  function buildEditor() {
    var main = E('admMain'); main.innerHTML = '';

    section('基础信息', function (c) {
      field(c, '浏览器标签标题', function () { return content.siteTitle; }, function (v) { content.siteTitle = v; });
    });

    section('首屏 Hero', function (c) {
      field(c, '顶部标签', function () { return content.hero.kicker; }, function (v) { content.hero.kicker = v; });
      field(c, '主标题', function () { return content.hero.title; }, function (v) { content.hero.title = v; });
      field(c, '副标题', function () { return content.hero.sub; }, function (v) { content.hero.sub = v; }, true);
      listEditor(c, function () { return content.hero.stats; },
        function () { return [{ key: 'num', label: '数字' }, { key: 'label', label: '说明' }]; }, '添加数据');
      imageField(c, '形象照', function () { return content.images.hero; }, function (v) { content.images.hero = v; });
    });

    section('媒体背书', function (c) {
      field(c, '标题', function () { return content.media.title; }, function (v) { content.media.title = v; });
      listEditor(c, function () { return content.media.btns; },
        function () { return [{ key: 'label', label: '按钮文字' }, { key: 'href', label: '链接' }, { key: 'alt', label: '描边样式', type: 'checkbox' }, { key: 'icon', label: '播放图标', type: 'checkbox' }]; }, '添加按钮');
    });

    section('关于尹辰', function (c) {
      field(c, '小标题', function () { return content.about.heading; }, function (v) { content.about.heading = v; }, true);
      field(c, '简介段落 1', function () { return content.about.bio[0]; }, function (v) { content.about.bio[0] = v; }, true);
      field(c, '简介段落 2', function () { return content.about.bio[1]; }, function (v) { content.about.bio[1] = v; }, true);
      field(c, '金句', function () { return content.about.callout; }, function (v) { content.about.callout = v; }, true);
      listEditor(c, function () { return content.about.advCards; },
        function () { return [{ key: 'ic', label: '图标' }, { key: 'title', label: '标题' }, { key: 'desc', label: '描述', type: 'textarea' }]; }, '添加优势卡片');
    });

    section('课程体系', function (c) {
      field(c, '标题', function () { return content.courses.heading; }, function (v) { content.courses.heading = v; }, true);
      field(c, '副标题', function () { return content.courses.sub; }, function (v) { content.courses.sub = v; }, true);
      var tip = document.createElement('p'); tip.className = 'adm-tip'; tip.textContent = '下方课程卡片支持拖拽排序、增删：';
      c.appendChild(tip);
      listEditor(c, function () { return content.courses.list; },
        function () { return [{ key: 'title', label: '课程名' }, { key: 'desc', label: '简介', type: 'textarea' }]; }, '添加课程');
      stringListEditor(c, function () { return content.courses.topics; }, '授课主题', '添加主题');
      field(c, '企业内训标题', function () { return content.courses.entBanner.title; }, function (v) { content.courses.entBanner.title = v; });
      field(c, '企业内训描述', function () { return content.courses.entBanner.desc; }, function (v) { content.courses.entBanner.desc = v; }, true);
      field(c, '企业内训按钮文字', function () { return content.courses.entBanner.btn; }, function (v) { content.courses.entBanner.btn = v; });
    });

    section('数字化交付', function (c) {
      field(c, '标题', function () { return content.system.heading; }, function (v) { content.system.heading = v; }, true);
      field(c, '副标题', function () { return content.system.sub; }, function (v) { content.system.sub = v; }, true);
      listEditor(c, function () { return content.system.cards; },
        function () { return [{ key: 'ic', label: '图标' }, { key: 'title', label: '标题' }, { key: 'desc', label: '描述', type: 'textarea' }]; }, '添加交付项');
    });

    section('专业认证', function (c) {
      field(c, '标题', function () { return content.certs.heading; }, function (v) { content.certs.heading = v; }, true);
      field(c, '副标题', function () { return content.certs.sub; }, function (v) { content.certs.sub = v; }, true);
      field(c, '高亮认证', function () { return content.certs.highlight; }, function (v) { content.certs.highlight = v; });
      stringListEditor(c, function () { return content.certs.list; }, '认证', '添加认证');
    });

    section('旗舰案例', function (c) {
      field(c, '标题', function () { return content.flagship.heading; }, function (v) { content.flagship.heading = v; });
      field(c, '说明文字', function () { return content.flagship.text; }, function (v) { content.flagship.text = v; }, true);
      stringListEditor(c, function () { return content.flagship.deliver; }, '交付物', '添加交付物');
      imageField(c, '案例配图', function () { return content.images.flagship; }, function (v) { content.images.flagship = v; });
    });

    section('客户案例', function (c) {
      field(c, '标题', function () { return content.clients.heading; }, function (v) { content.clients.heading = v; }, true);
      field(c, '副标题', function () { return content.clients.sub; }, function (v) { content.clients.sub = v; }, true);
      stringListEditor(c, function () { return content.clients.tags; }, '客户类型', '添加类型');
      listEditor(c, function () { return content.clients.testi; },
        function () { return [{ key: 'text', label: '评价内容', type: 'textarea' }, { key: 'who', label: '评价人' }]; }, '添加评价');
    });

    section('线上分享海报', function (c) {
      field(c, '标题', function () { return content.sharing.heading; }, function (v) { content.sharing.heading = v; });
      selectField(c, '排列方式', function () { return content.sharing.layout || 'grid'; }, function (v) { content.sharing.layout = v; }, [
        { value: 'grid', label: '三列网格' },
        { value: 'list', label: '单列（竖向一排）' }
      ]);
      selectField(c, '照片比例', function () { return content.sharing.ratio || '760/1280'; }, function (v) { content.sharing.ratio = v; }, [
        { value: '760/1280', label: '原海报比例 (760×1280)' },
        { value: '1/1', label: '1:1 方形' },
        { value: '3/4', label: '3:4 竖图' },
        { value: '4/5', label: '4:5 竖图' },
        { value: '4/3', label: '4:3 横图' },
        { value: '16/9', label: '16:9 宽屏' },
        { value: '9/16', label: '9:16 手机长图' }
      ]);
      var tip = document.createElement('p'); tip.className = 'adm-tip'; tip.textContent = '拖拽可调整海报顺序，上传可替换图片：';
      c.appendChild(tip);
      imageListEditor(c, function () { return content.sharing.posters; });
    });

    section('结尾标语', function (c) {
      field(c, '标题', function () { return content.final.heading; }, function (v) { content.final.heading = v; });
      field(c, '副标题', function () { return content.final.sub; }, function (v) { content.final.sub = v; }, true);
    });

    section('页脚 / 联系', function (c) {
      field(c, '落款名', function () { return content.footer.brand; }, function (v) { content.footer.brand = v; });
      field(c, '副标题', function () { return content.footer.role; }, function (v) { content.footer.role = v; });
      field(c, '邮箱', function () { return content.footer.email; }, function (v) { content.footer.email = v; });
      listEditor(c, function () { return content.footer.nav; },
        function () { return [{ key: 'label', label: '文字' }, { key: 'href', label: '锚点(如 #about)' }]; }, '添加导航');
      imageField(c, '微信二维码', function () { return content.images.wechat; }, function (v) { content.images.wechat = v; });
    });
  }

  /* ---------- 顶部操作 ---------- */
  E('btnPreview').addEventListener('click', function () {
    if (!content) return;
    localStorage.setItem(PREVIEW_KEY, JSON.stringify(content));
    window.open('index.html?preview=1', '_blank');
  });
  E('btnClear').addEventListener('click', function () {
    localStorage.removeItem(PREVIEW_KEY);
    alert('已清空预览缓存。公开访问将显示已发布版本（你导出的 content.json 发布后才更新）。');
  });
  E('btnExport').addEventListener('click', function () {
    if (!content) return;
    var blob = new Blob([JSON.stringify(content, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'content.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    alert('已下载 content.json。把此文件发给我，我即可重新发布你的修改。');
  });

  /* ---------- 密码进入 ---------- */
  function unlock() {
    var pw = E('pwInput').value;
    if (pw === ADMIN_PW) {
      E('gate').style.display = 'none';
      E('app').style.display = 'block';
      fetch('content.json').then(function (r) { return r.json(); }).then(function (c) {
        content = c; buildEditor();
      }).catch(function (e) { alert('读取 content.json 失败：' + e); });
    } else {
      alert('密码错误');
    }
  }
  E('pwBtn').addEventListener('click', unlock);
  E('pwInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
})();
</script>
</body>
</html>
